<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <h1>Calculator</h1>
        </header>

        <main>
            <div class="calculator" role="application" aria-label="Calculator">
                <div class="display">
                    <div id="expression" class="expression" aria-hidden="true"></div>
                    <input type="text" id="result" disabled placeholder="0" aria-label="Result">
                </div>

                <div class="buttons">
                    <button class="btn operator clear" onclick="clearDisplay()">AC</button>
                    <button class="btn operator" onclick="deleteLast()">DEL</button>
                    <button class="btn operator" onclick="appendValue('%')">%</button>
                    <button class="btn operator" onclick="appendValue('/')">÷</button>

                    <button class="btn" onclick="appendValue('7')">7</button>
                    <button class="btn" onclick="appendValue('8')">8</button>
                    <button class="btn" onclick="appendValue('9')">9</button>
                    <button class="btn operator" onclick="appendValue('*')">×</button>

                    <button class="btn" onclick="appendValue('4')">4</button>
                    <button class="btn" onclick="appendValue('5')">5</button>
                    <button class="btn" onclick="appendValue('6')">6</button>
                    <button class="btn operator" onclick="appendValue('-')">−</button>

                    <button class="btn" onclick="appendValue('1')">1</button>
                    <button class="btn" onclick="appendValue('2')">2</button>
                    <button class="btn" onclick="appendValue('3')">3</button>
                    <button class="btn operator" onclick="appendValue('+')">+</button>

                    <button class="btn" onclick="appendValue('00')">00</button>
                    <button class="btn" onclick="appendValue('0')">0</button>
                    <button class="btn" onclick="appendValue('.')">.</button>
                    <button class="btn equal" onclick="calculateResult()">=</button>
                </div>

                <div class="credit">Created by Harsh Nagar</div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
